[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rolloutbridge"
version = "0.1.0"
description = "A small exact-token bridge from agent rollouts to VERL training batches."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
examples = [
  "langchain>=1.3,<2",
  "langchain-openai>=1.1,<2",
  "openai>=2,<3",
]
train = [
  "accelerate>=1.1,<2",
  "numpy>=2,<3",
  "transformers>=4.51,<5",
  "verl==0.8.0",
  "vllm==0.20.2",
]

[tool.uv]
# VERL 0.8.0 still declares numpy<2 while vLLM 0.20.2 requires numpy>=2.
# The frozen smoke stack intentionally chooses vLLM's runtime-compatible side.
override-dependencies = ["numpy>=2,<3"]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
rolloutbridge-gateway = "rolloutbridge.gateway:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rolloutbridge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: optional cross-process integration tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
